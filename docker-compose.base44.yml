services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Majestic Hotel"
      base44.kind: "web"
      base44.port: "3000"
    command:
      - sh
      - -ec
      - |
        CI=true npm ci --no-audit --no-fund
        exec npm run dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    environment:
      # Provided by the Base44 sandbox; Vite >= 6.1 appends it to server.allowedHosts
      # so the preview host can reach the dev server. Empty outside the sandbox.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  node_modules:
  npm_cache:
